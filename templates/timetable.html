
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable | Campus IQ</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .timetable-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        .timetable-container h2 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-buttons button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #e2e8f0;
            color: #1e293b;
            cursor: pointer;
        }

        .filter-buttons button.active {
            background: #2563eb;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .timetable-container {
                margin: 15px;
                padding: 15px;
                overflow-x: auto;
            }

            th, td {
                padding: 9px;
            }
        }
    </style>
</head>

<body>

<div class="timetable-container">

    <h2>📅 Class Timetable</h2>

    {% if timetable_data %}

    <div class="filter-buttons">
        <button class="active" onclick="filterDay('all', this)">All</button>
        <button onclick="filterDay('monday', this)">Monday</button>
        <button onclick="filterDay('tuesday', this)">Tuesday</button>
        <button onclick="filterDay('wednesday', this)">Wednesday</button>
        <button onclick="filterDay('thursday', this)">Thursday</button>
        <button onclick="filterDay('friday', this)">Friday</button>
        <button onclick="filterDay('saturday', this)">Saturday</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Subject</th>
                <th>Room</th>
            </tr>
        </thead>

        <tbody id="timetableBody">

            {% for item in timetable_data %}
            <tr data-day="{{ item.day|lower }}">
                <td>{{ item.day }}</td>
                <td>{{ item.time }}</td>
                <td>{{ item.subject }}</td>
                <td>{{ item.room }}</td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

    <p id="noClasses" style="display:none;">
        No classes scheduled for this day.
    </p>

    {% else %}

    <p>No timetable records are available yet.</p>

    {% endif %}

    <a href="{{ url_for('dashboard') }}" class="back-link">
        ← Back to Dashboard
    </a>

</div>

<script>
    function filterDay(day, button) {

        const rows = document.querySelectorAll("#timetableBody tr");
        let visibleCount = 0;

        rows.forEach(row => {

            if (day === "all" || row.dataset.day === day) {
                row.style.display = "";
                visibleCount++;
            } else {
                row.style.display = "none";
            }

        });

        document.querySelectorAll(".filter-buttons button")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        const noClasses = document.getElementById("noClasses");

        if (noClasses) {
            noClasses.style.display = visibleCount === 0 ? "block" : "none";
        }
    }
</script>

</body>
</html>
